spring.application.name=controle-eventos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/controle_eventos}
spring.datasource.username=${DB_USERNAME:felipe}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

