<!DOCTYPE html>
<!-- Autor: Felipe Alves -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Felipe Alves">
        <title>Entrar - Controle de Eventos</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <main class="login-caixa">
            <div class="login-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg></div>
            <h1>Controle de Eventos</h1>
            <p>Entre com seu e-mail e senha</p>
            <div class="mensagem-erro" th:if="${param.error}">
                E-mail ou senha inválidos.
            </div>
            <div class="mensagem-sucesso" th:if="${param.logout}">
                Sessão encerrada com sucesso.
            </div>
            <div class="mensagem-sucesso" th:if="${param.cadastro}">
                Conta criada! Entre com seu e-mail e senha.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="username">E-mail</label>
                    <input id="username" name="username" type="email"
                           autocomplete="username" placeholder="voce@exemplo.com" required>
                </div>
                <div class="campo">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" placeholder="Sua senha" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p class="link-extra">Não possui conta?
                <a th:href="@{/cadastro}">Cadastre-se</a>
            </p>
        </main>
    </body>
</html>
